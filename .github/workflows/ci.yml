name: CI
on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run typecheck
      - run: npm run check:tags
      - run: npm test
      - run: npm run build:docs
