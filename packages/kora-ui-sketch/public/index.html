<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propuesta · Istmo Code</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="side" class="panel">
    <div class="pp-top">
      <span class="logo" role="img" aria-label="Istmo Code"></span>
      <a id="home" class="pp-home" href="/" hidden>Mis propuestas</a>
    </div>
    <div id="plan"></div>
    <details id="gen" class="tool local-only">
      <summary>Generar con IA</summary>
      <label for="prompt">Describe la app o pega los requerimientos</label>
      <textarea id="prompt" rows="12" placeholder="Ej: Sistema para un taller con gerencia, vendedores e instaladores..."></textarea>
      <button id="go" class="primary">Generar con IA</button>
    </details>
    <div id="palette" hidden>
      <p class="hint">Arrastra componentes al lienzo. Clic para seleccionar · Supr para borrar · ⌘Z deshacer.</p>
    </div>
    <button id="print" class="tool">Imprimir / PDF</button>
    <p id="status" role="status" class="tool"></p>
    <details class="tool">
      <summary>Proyecto</summary>
      <div class="stack">
        <button id="example" class="local-only">Cargar ejemplo: Ventanas Vigil</button>
        <button id="new" class="local-only">Proyecto en blanco</button>
        <button id="export">Exportar JSON</button>
        <label class="button local-only">Importar JSON<input id="import" type="file" accept=".json,application/json" hidden /></label>
      </div>
    </details>
    <details class="tool local-only">
      <summary>Kits genéricos</summary>
      <p class="hint">Pantallas comunes a todos tus sistemas. Se agregan solas a cada proyecto nuevo.</p>
      <div id="kits" class="stack"></div>
    </details>
    <details class="tool local-only">
      <summary>JSON (editable)</summary>
      <textarea id="json" rows="16" spellcheck="false"></textarea>
      <button id="apply">Aplicar JSON</button>
    </details>
  </aside>
  <main>
    <div class="topbar">
      <button id="toggle-panel" type="button" aria-controls="side" aria-expanded="true" title="Ocultar o mostrar la propuesta" aria-label="Ocultar o mostrar la propuesta"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2"/><path d="M7 3v12"/></svg></button>
      <nav id="sections" aria-label="Secciones"></nav>
      <button id="device">Ver móvil</button>
      <button id="mode" class="primary tool">Editar</button>
    </div>
    <nav id="screens" aria-label="Pantallas"></nav>
    <div id="canvas"><p class="empty">El wireframe aparecerá aquí.</p></div>
  </main>
  <aside id="inspector" class="panel" hidden></aside>
  <div id="drop-line" hidden></div>
  <nav id="switch" aria-label="Vista">
    <button id="show-plan" type="button">Propuesta</button>
    <button id="show-proto" type="button">Prototipo</button>
  </nav>
  <article id="quote"></article>
  <script type="module" src="/app.js"></script>
</body>
</html>
